<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haptics check</title>
<style>
  :root{color-scheme:dark;}
  body{margin:0;padding:24px 16px 48px;background:#0A0A0C;color:#F2EDE6;font:16px/1.5 ui-monospace,Menlo,monospace;}
  h1{font:600 1.3rem Georgia,serif;margin:0 0 4px;}
  p{color:#9C958C;margin:0 0 20px;font-size:.8rem;}
  .row{display:flex;align-items:center;gap:12px;margin:0 0 14px;}
  button{flex:1;min-height:52px;border-radius:12px;border:1px solid #2A272C;background:#141316;color:#F2EDE6;font:inherit;font-size:.9rem;text-align:left;padding:0 16px;}
  button:active{background:#221f24;}
  .n{width:24px;color:#E8A33C;}
  label.vis{display:flex;align-items:center;gap:10px;min-height:52px;}
  input[switch]{transform:scale(1.4);}
  #ua{word-break:break-all;}
  .ov{position:relative;flex:1;display:flex;}
  .ov__sw{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}
  .ov__sw--flat{appearance:none;-webkit-appearance:none;}
  .lb{flex:1;display:flex;align-items:center;min-height:52px;border-radius:12px;border:1px solid #2A272C;background:#141316;padding:0 16px;font-size:.9rem;}
  .lb__sw{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:-1px;}
</style>
</head>
<body>
<h1>Haptics check</h1>
<p>Tap each one and note which you feel. Do it in Arc, then in Safari.</p>

<div class="row"><span class="n">1</span><label class="vis"><input type="checkbox" switch> a real switch, tapped by you</label></div>
<div class="row"><span class="n">2</span><button id="b2" type="button">what the deck does now (on click)</button></div>
<div class="row"><span class="n">3</span><button id="b3" type="button">hidden switch, display:none (on click)</button></div>
<div class="row"><span class="n">4</span><button id="b4" type="button">hidden switch, fired on touch-down</button></div>
<div class="row"><span class="n">5</span><button id="b5" type="button">navigator.vibrate</button></div>

<div class="row"><span class="n">6</span><span class="ov"><button type="button" tabindex="-1">invisible switch over a button (opacity 0)</button><input class="ov__sw" type="checkbox" switch aria-label="6"></span></div>
<div class="row"><span class="n">7</span><span class="ov"><button type="button" tabindex="-1">invisible switch, unstyled (appearance none)</button><input class="ov__sw ov__sw--flat" type="checkbox" switch aria-label="7"></span></div>
<div class="row"><span class="n">8</span><label class="lb"><input class="lb__sw" type="checkbox" switch> a button-looking label, its switch clipped out of sight</label></div>

<p id="ua"></p>
<script src="haptics.js"></script>
</body>
</html>
